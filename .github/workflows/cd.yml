name: CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    defaults:
      run:
        shell: cmd
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker info (fail fast if daemon not ready)
        run: docker info

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker logout
          echo %DOCKERHUB_TOKEN% | docker login -u %DOCKERHUB_USERNAME% --password-stdin

      - name: Write .env (Airflow & apps)
        run: |
          echo FERNET_KEY=${{ secrets.FERNET_KEY }} > .env
          if not "${{ secrets.ADMIN_USER }}"==""       echo ADMIN_USER=${{ secrets.ADMIN_USER }}>> .env
          if not "${{ secrets.ADMIN_PASSWORD }}"==""   echo ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}>> .env
          if not "${{ secrets.JWT_SECRET }}"==""       echo JWT_SECRET=${{ secrets.JWT_SECRET }}>> .env

      - name: Pull images
        run: docker compose -f docker-compose.yml --project-name mlops pull --ignore-pull-failures

      - name: Up services
        run: docker compose -f docker-compose.yml --project-name mlops up -d --remove-orphans --no-build

      - name: Quick status
        run: docker compose -f docker-compose.yml --project-name mlops ps

      - name: Diagnostics (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml --project-name mlops logs --no-color --tail=200
