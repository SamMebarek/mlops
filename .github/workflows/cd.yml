name: CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    defaults:
      run:
        shell: cmd
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker logout 2>nul || echo ok
          echo %DOCKERHUB_TOKEN% | docker login -u %DOCKERHUB_USERNAME% --password-stdin

      - name: Pull images
        run: docker compose -f docker-compose.yml --project-name mlops pull

      - name: Up services
        run: docker compose -f docker-compose.yml --project-name mlops up -d --remove-orphans --no-build

      - name: Health checks
        run: |
          curl --retry 20 --retry-delay 5 --fail http://localhost:8002/health
          curl --retry 20 --retry-delay 5 --fail http://localhost:8080/health
          curl --retry 20 --retry-delay 5 --fail http://localhost:9090/-/ready

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          docker compose -f docker-compose.yml --project-name mlops ps
          docker compose -f docker-compose.yml --project-name mlops logs --no-color --tail=150
