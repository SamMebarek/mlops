name: CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    defaults:
      run:
        shell: cmd
        working-directory: ${{ github.workspace }}

    env:
      COMPOSE_FILE_PATH: docker-compose.yaml
      COMPOSE_PROJECT_NAME: mlops

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity checks
        run: |
          echo Repo at: %CD%
          if not exist "%COMPOSE_FILE_PATH%" (
            echo [ERREUR] Fichier compose introuvable: %COMPOSE_FILE_PATH%
            dir /b /s docker-compose*.yml docker-compose*.yaml
            exit /b 1
          )

      - name: Docker info
        run: docker info

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker logout
          echo %DOCKERHUB_TOKEN% | docker login -u %DOCKERHUB_USERNAME% --password-stdin

      - name: Ecrire .env (min)
        run: |
          > .env (
            echo FERNET_KEY=${{ secrets.FERNET_KEY }}
          )
          if not "${{ secrets.ADMIN_USER }}"==""       ( echo ADMIN_USER=${{ secrets.ADMIN_USER }}>> .env )
          if not "${{ secrets.ADMIN_PASSWORD }}"==""   ( echo ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}>> .env )
          if not "${{ secrets.JWT_SECRET }}"==""       ( echo JWT_SECRET=${{ secrets.JWT_SECRET }}>> .env )

      - name: Stop/clean previous project (safe)
        run: |
          docker compose -f "%COMPOSE_FILE_PATH%" --project-name %COMPOSE_PROJECT_NAME% down --remove-orphans
          REM Cleanup legacy single-name containers that may collide
          docker rm -f pushgateway  2>nul
          docker rm -f grafana      2>nul
          docker rm -f prometheus   2>nul

      - name: Pull images
        run: docker compose -f "%COMPOSE_FILE_PATH%" --project-name %COMPOSE_PROJECT_NAME% pull --ignore-pull-failures --include-deps

      - name: Up services
        run: docker compose -f "%COMPOSE_FILE_PATH%" --project-name %COMPOSE_PROJECT_NAME% up -d --remove-orphans --no-build

      - name: Status
        run: docker compose -f "%COMPOSE_FILE_PATH%" --project-name %COMPOSE_PROJECT_NAME% ps

      - name: Health check (gateway)
        run: |
          set URL=http://localhost:8002/health
          for /l %%i in (1,1,30) do (
            curl -s -m 5 "%URL%" && goto ok
            timeout /t 5 >nul
          )
          echo FAIL %URL%
          exit /b 1
          :ok
          echo OK %URL%

      - name: Health check (inference)
        run: |
          set URL=http://localhost:8080/health
          for /l %%i in (1,1,30) do (
            curl -s -m 5 "%URL%" && goto ok
            timeout /t 5 >nul
          )
          echo FAIL %URL%
          exit /b 1
          :ok
          echo OK %URL%

      - name: Health check (Prometheus)
        run: |
          set URL=http://localhost:9090/-/ready
          for /l %%i in (1,1,30) do (
            curl -s -m 5 "%URL%" && goto ok
            timeout /t 5 >nul
          )
          echo FAIL %URL%
          exit /b 1
          :ok
          echo OK %URL%

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          docker compose -f "%COMPOSE_FILE_PATH%" --project-name %COMPOSE_PROJECT_NAME% ps
          docker compose -f "%COMPOSE_FILE_PATH%" --project-name %COMPOSE_PROJECT_NAME% logs --no-color --tail=200
