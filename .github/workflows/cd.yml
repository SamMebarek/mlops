name: CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    defaults:
      run:
        shell: cmd
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: |
          docker logout 2>$null || echo "ok"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull images
        run: |
          docker compose -f docker-compose.yml --project-name mlops pull

      - name: Up services
        run: |
          docker compose -f docker-compose.yml --project-name mlops up -d --remove-orphans --no-build

      - name: Health checks
        run: |
          function Test-Http($url, $retries=20, $delay=5) {
            for ($i=0; $i -lt $retries; $i++) {
              try {
                $r = Invoke-RestMethod -Uri $url -TimeoutSec 5
                Write-Host "OK $url"
                return
              } catch {
                Start-Sleep -Seconds $delay
              }
            }
            throw "Fail $url"
          }
          Test-Http "http://localhost:8002/health"
          Test-Http "http://localhost:8080/health"
          Test-Http "http://localhost:9090/-/ready"

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          docker compose -f docker-compose.yml --project-name mlops ps
          docker compose -f docker-compose.yml --project-name mlops logs --no-color --tail=150
